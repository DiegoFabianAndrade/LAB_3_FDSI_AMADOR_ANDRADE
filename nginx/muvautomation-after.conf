# ============================================================================
# Configuración Nginx VirtualHost - Hardened (Después de Corrección)
# Laboratorio: FDSI 2026 - Laboratorio 3 (Blue Team Hardening)
# Estado del Control: Remediada la exposición de versión y acceso a archivos ocultos
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/muvautomation;
    index index.html;

    # CONFIGURACIÓN HARDENED (Requerimientos Lab 3):
    server_tokens off;                                        # Oculta versión de Nginx
    add_header X-Content-Type-Options "nosniff" always;       # Previene MIME-sniffing
    add_header X-Frame-Options "DENY" always;                 # Previene Clickjacking
    add_header Referrer-Policy "no-referrer" always;           # Restringe fuga de referrer

    autoindex off;                                            # Deshabilita navegación de directorios

    # Denegar acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Proxy hacia la aplicación de automatización CrowdStrike Falcon Hub
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
