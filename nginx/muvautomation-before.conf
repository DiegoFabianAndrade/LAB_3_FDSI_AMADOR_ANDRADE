# ============================================================================
# Configuración Nginx VirtualHost - Línea Base (Sin Hardening - Antes)
# Laboratorio: FDSI 2026 - Laboratorio 3
# Nivel de Riesgo: Alto (Expone versión, archivos ocultos y carece de cabeceras)
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/muvautomation;
    index index.html;

    # CONFIGURACIÓN INSEGURA BASELINE:
    server_tokens on;       # Expone la versión de Nginx en cabeceras y páginas de error
    autoindex on;           # Permite exploración de directorios si falta index

    # Proxy hacia la aplicación de automatización CrowdStrike Falcon Hub
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
